name: ⚽ Contribution dribble

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the dribble across the pitch
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pitch-dribble.svg?color_snake=#ff1744&color_dots=#e6f0ff,#80deea,#00c853,#2979ff,#0a1440
            dist/pitch-dribble-dark.svg?palette=github-dark&color_snake=#ff1744&color_dots=#0a0f1f,#0a2a6b,#2979ff,#00c853,#39ff14

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
