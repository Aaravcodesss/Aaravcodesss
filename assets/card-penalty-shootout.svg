<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="460" height="250" role="img" aria-label="Penalty Shootout">
<style>
.edge{stroke-dasharray:1400;stroke-dashoffset:1400;animation:e 2.2s cubic-bezier(.65,0,.35,1) forwards}
@keyframes e{to{stroke-dashoffset:0}}
.pulse{animation:p 2.4s ease-in-out infinite alternate}@keyframes p{from{opacity:.35}to{opacity:1}}
.kp{animation:kp 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes kp{0%,35%{transform:none}55%,85%{transform:translateX(-34px) rotate(-60deg)}100%{transform:none}}.bl{transform-box:fill-box;transform-origin:center;animation:bl 3s ease-in infinite}@keyframes bl{0%,30%{transform:none;opacity:1}50%{transform:translate(40px,-76px) scale(.6)}85%{transform:translate(40px,-76px) scale(.6);opacity:1}100%{opacity:0}}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1730"/><stop offset="1" stop-color="#05070d"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="1" y="1" width="458" height="248" rx="16" fill="url(#g)" stroke="#1a2438"/>
<rect class="edge" x="1" y="1" width="458" height="248" rx="16" fill="none" stroke="#ff2a46" stroke-width="1.6"/>
<g><path d="M305 172V100H435V172" fill="none" stroke="#f2fbff" stroke-width="3.5" filter="url(#glow)"/><path d="M319.4 100v72" stroke="#ffffff" stroke-opacity=".12"/><path d="M333.9 100v72" stroke="#ffffff" stroke-opacity=".12"/><path d="M348.3 100v72" stroke="#ffffff" stroke-opacity=".12"/><path d="M362.8 100v72" stroke="#ffffff" stroke-opacity=".12"/><path d="M377.2 100v72" stroke="#ffffff" stroke-opacity=".12"/><path d="M391.7 100v72" stroke="#ffffff" stroke-opacity=".12"/><path d="M406.1 100v72" stroke="#ffffff" stroke-opacity=".12"/><path d="M420.6 100v72" stroke="#ffffff" stroke-opacity=".12"/><path d="M305 114.4h130" stroke="#ffffff" stroke-opacity=".12"/><path d="M305 128.8h130" stroke="#ffffff" stroke-opacity=".12"/><path d="M305 143.2h130" stroke="#ffffff" stroke-opacity=".12"/><path d="M305 157.6h130" stroke="#ffffff" stroke-opacity=".12"/><g class="kp"><circle cx="370.0" cy="134" r="6" fill="#ff2a46" filter="url(#glow)"/><rect x="364.0" y="142" width="12" height="24" rx="4" fill="#ff2a46"/></g><circle class="bl" cx="370.0" cy="214" r="7" fill="#fff" filter="url(#glow)"/></g>
<circle class="pulse" cx="34" cy="38" r="4.5" fill="#ff2a46"/>
<text x="46" y="43" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="12" letter-spacing="3" fill="#ff2a46">BROWSER GAME</text>
<text x="28" y="84" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="900" font-style="italic" font-size="26" fill="#e8eef5">Penalty Shootout</text>
<text x="28" y="118" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c4d4">A neon shootout where the keeper</text><text x="28" y="139" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c4d4">learns your habits with a Markov</text><text x="28" y="160" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c4d4">chain. Don't be predictable.</text>
<rect x="28" y="206" width="58" height="22" rx="11" fill="none" stroke="#1a2438"/><text x="57" y="221" text-anchor="middle" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#7f8ba0">Canvas</text><rect x="94.4" y="206" width="81" height="22" rx="11" fill="none" stroke="#1a2438"/><text x="135" y="221" text-anchor="middle" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#7f8ba0">Web Audio</text><rect x="183.0" y="206" width="29" height="22" rx="11" fill="none" stroke="#1a2438"/><text x="197" y="221" text-anchor="middle" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#7f8ba0">AI</text>
</svg>