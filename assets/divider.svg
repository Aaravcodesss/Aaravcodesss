<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40" role="img" aria-label="divider">
<style>.l{stroke:#1d6b45;stroke-width:1;stroke-dasharray:560;stroke-dashoffset:560;animation:d 2.4s ease forwards}
.c{fill:none;stroke:#39ff88;stroke-width:1.2;stroke-dasharray:4 4;animation:spin 10s linear infinite;transform-origin:600px 20px}
.b{animation:roll 4s cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes d{to{stroke-dashoffset:0}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes roll{from{transform:translateX(-9px)}to{transform:translateX(9px)}}</style>
<line class="l" x1="582" y1="20" x2="20" y2="20"/><line class="l" x1="618" y1="20" x2="1180" y2="20"/>
<circle class="c" cx="600" cy="20" r="15"/>
<circle class="b" cx="600" cy="20" r="3.4" fill="#00e5ff"/>
</svg>