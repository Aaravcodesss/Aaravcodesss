<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="460" height="250" role="img" aria-label="Tactics Board">
<style>
.edge{stroke-dasharray:1400;stroke-dashoffset:1400;animation:e 2.2s cubic-bezier(.65,0,.35,1) forwards}
@keyframes e{to{stroke-dashoffset:0}}
.pulse{animation:p 2.4s ease-in-out infinite alternate}@keyframes p{from{opacity:.35}to{opacity:1}}
.mv{stroke-dashoffset:230;animation:mv 3.2s ease-in-out infinite}@keyframes mv{0%{stroke-dashoffset:230}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-230}}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1730"/><stop offset="1" stop-color="#05070d"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="1" y="1" width="458" height="248" rx="16" fill="url(#g)" stroke="#1a2438"/>
<rect class="edge" x="1" y="1" width="458" height="248" rx="16" fill="none" stroke="#00e5ff" stroke-width="1.6"/>
<g><rect x="300" y="30" width="135" height="190" rx="4" fill="#0b2418" stroke="#39ff88" stroke-opacity=".5"/><path d="M300 125.0h135" stroke="#39ff88" stroke-opacity=".5"/><circle cx="367.5" cy="125.0" r="20" fill="none" stroke="#39ff88" stroke-opacity=".5"/><path class="mv" d="M330 180 L370 140 L340 90 L400 70" fill="none" stroke="#00e5ff" stroke-width="2.4" stroke-dasharray="230" filter="url(#glow)"/><circle cx="330" cy="180" r="6" fill="#00e5ff" filter="url(#glow)"/><circle cx="370" cy="140" r="6" fill="#00e5ff" filter="url(#glow)"/><circle cx="340" cy="90" r="6" fill="#00e5ff" filter="url(#glow)"/><circle cx="400" cy="70" r="6" fill="#00e5ff" filter="url(#glow)"/></g>
<circle class="pulse" cx="34" cy="38" r="4.5" fill="#00e5ff"/>
<text x="46" y="43" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="12" letter-spacing="3" fill="#00e5ff">WEB APP</text>
<text x="28" y="84" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="900" font-style="italic" font-size="30" fill="#e8eef5">Tactics Board</text>
<text x="28" y="118" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c4d4">Pick a formation, drag players,</text><text x="28" y="139" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c4d4">draw passes &amp; runs — then share</text><text x="28" y="160" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c4d4">the lineup as a link or a PNG.</text>
<rect x="28" y="206" width="88" height="22" rx="11" fill="none" stroke="#1a2438"/><text x="72" y="221" text-anchor="middle" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#7f8ba0">JavaScript</text><rect x="124.0" y="206" width="36" height="22" rx="11" fill="none" stroke="#1a2438"/><text x="142" y="221" text-anchor="middle" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#7f8ba0">SVG</text><rect x="168.2" y="206" width="118" height="22" rx="11" fill="none" stroke="#1a2438"/><text x="227" y="221" text-anchor="middle" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#7f8ba0">Pointer Events</text>
</svg>