<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" width="320" height="460">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1440"/>
      <stop offset="55%" stop-color="#050a1f"/>
      <stop offset="100%" stop-color="#03200f">
        <animate attributeName="stop-color" values="#03200f;#2a0510;#04163d;#03200f" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <!-- Neon border cycling green / cyan / blue / red -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39ff14">
        <animate attributeName="stop-color" values="#39ff14;#00e5ff;#2979ff;#ff1744;#39ff14" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff1744">
        <animate attributeName="stop-color" values="#ff1744;#39ff14;#00e5ff;#2979ff;#ff1744" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff14">
        <animate attributeName="stop-color" values="#39ff14;#00e5ff;#ff1744;#39ff14" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#ff1744;#39ff14;#00e5ff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="outline" d="M160 6 C 200 26 250 28 300 22 L 300 360 C 300 400 230 430 160 454 C 90 430 20 400 20 360 L 20 22 C 70 28 120 26 160 6 Z"/>
    <clipPath id="shape"><use href="#outline"/></clipPath>
  </defs>

  <g clip-path="url(#shape)">
    <rect width="320" height="460" fill="url(#card)"/>
    <!-- circuit-ish grid -->
    <g stroke="#00e5ff" stroke-opacity="0.08" stroke-width="1">
      <path d="M0 60H320M0 120H320M0 180H320M0 240H320M0 300H320M0 360H320M0 420H320"/>
      <path d="M40 0V460M100 0V460M160 0V460M220 0V460M280 0V460"/>
    </g>
    <rect x="-200" y="0" width="140" height="460" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-260;520" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <use href="#outline" fill="none" stroke="url(#edge)" stroke-width="5" filter="url(#glow)"/>

  <g font-family="'Arial Black','Segoe UI',Impact,sans-serif" fill="url(#txt)" filter="url(#glow)">
    <text x="58" y="95" font-size="56" font-weight="900">99</text>
    <text x="64" y="122" font-size="22" font-weight="900">LW</text>
  </g>
  <text x="64" y="160" font-size="28">💻</text>
  <text x="64" y="196" font-size="26">🇮🇳</text>

  <!-- Avatar silhouette with a small Nº10 nod -->
  <g transform="translate(205,140)">
    <circle cx="0" cy="-30" r="32" fill="#1b2a6b" stroke="#00e5ff" stroke-width="2"/>
    <path d="M -62 70 C -58 20 -30 8 0 8 C 30 8 58 20 62 70 Z" fill="#1b2a6b" stroke="#00e5ff" stroke-width="2"/>
    <text x="0" y="60" text-anchor="middle" font-family="'Arial Black',Impact,sans-serif" font-size="34" font-weight="900" fill="#39ff14" filter="url(#glow)">10</text>
  </g>

  <text x="160" y="250" text-anchor="middle" font-family="'Arial Black','Segoe UI',Impact,sans-serif" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="3" filter="url(#glow)">AARAV</text>
  <line x1="50" y1="264" x2="270" y2="264" stroke="url(#edge)" stroke-width="2"/>

  <g font-family="'Segoe UI',Verdana,sans-serif" font-size="19" fill="#e6f0ff">
    <text x="62" y="298"><tspan font-weight="900" fill="#39ff14">97</tspan> CODE</text>
    <text x="62" y="328"><tspan font-weight="900" fill="#00e5ff">99</tspan> SKIL</text>
    <text x="62" y="358"><tspan font-weight="900" fill="#ff1744">96</tspan> DRIB</text>
    <text x="178" y="298"><tspan font-weight="900" fill="#39ff14">95</tspan> SHIP</text>
    <text x="178" y="328"><tspan font-weight="900" fill="#00e5ff">98</tspan> FLAIR</text>
    <text x="178" y="358"><tspan font-weight="900" fill="#ff1744">94</tspan> DBUG</text>
  </g>
  <line x1="160" y1="280" x2="160" y2="368" stroke="#2979ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="160" y="405" text-anchor="middle" font-family="'Segoe UI',Verdana,sans-serif" font-size="14" fill="#8fb4ff" letter-spacing="3">⚽ CODE WITH FLAIR ⚽</text>
</svg>
