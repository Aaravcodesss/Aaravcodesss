<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="460" height="250" role="img" aria-label="league-sim">
<style>
.edge{stroke-dasharray:1400;stroke-dashoffset:1400;animation:e 2.2s cubic-bezier(.65,0,.35,1) forwards}
@keyframes e{to{stroke-dashoffset:0}}
.pulse{animation:p 2.4s ease-in-out infinite alternate}@keyframes p{from{opacity:.35}to{opacity:1}}
.bar{transform-box:fill-box;transform-origin:left;animation:bar 4s cubic-bezier(.19,1,.22,1) infinite}@keyframes bar{0%{transform:scaleX(0)}30%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1730"/><stop offset="1" stop-color="#05070d"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="1" y="1" width="458" height="248" rx="16" fill="url(#g)" stroke="#1a2438"/>
<rect class="edge" x="1" y="1" width="458" height="248" rx="16" fill="none" stroke="#39ff88" stroke-width="1.6"/>
<g><rect class="bar" style="animation-delay:0.00s" x="300" y="40" width="121" height="12" rx="3" fill="#00e5ff" fill-opacity=".85"/><rect class="bar" style="animation-delay:0.12s" x="300" y="62" width="108" height="12" rx="3" fill="#00e5ff" fill-opacity=".85"/><rect class="bar" style="animation-delay:0.24s" x="300" y="84" width="64" height="12" rx="3" fill="#39ff88" fill-opacity=".85"/><rect class="bar" style="animation-delay:0.36s" x="300" y="106" width="63" height="12" rx="3" fill="#39ff88" fill-opacity=".85"/><rect class="bar" style="animation-delay:0.48s" x="300" y="128" width="46" height="12" rx="3" fill="#39ff88" fill-opacity=".85"/><rect class="bar" style="animation-delay:0.60s" x="300" y="150" width="37" height="12" rx="3" fill="#39ff88" fill-opacity=".85"/><rect class="bar" style="animation-delay:0.72s" x="300" y="172" width="31" height="12" rx="3" fill="#ff2a46" fill-opacity=".85"/><rect class="bar" style="animation-delay:0.84s" x="300" y="194" width="27" height="12" rx="3" fill="#ff2a46" fill-opacity=".85"/></g>
<circle class="pulse" cx="34" cy="38" r="4.5" fill="#39ff88"/>
<text x="46" y="43" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="12" letter-spacing="3" fill="#39ff88">PYTHON · DATA</text>
<text x="28" y="84" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="900" font-style="italic" font-size="30" fill="#e8eef5">league-sim</text>
<text x="28" y="118" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c4d4">Simulates a football season 10,000</text><text x="28" y="139" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c4d4">times with Elo + Poisson to get</text><text x="28" y="160" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c4d4">title &amp; relegation odds.</text>
<rect x="28" y="206" width="58" height="22" rx="11" fill="none" stroke="#1a2438"/><text x="57" y="221" text-anchor="middle" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#7f8ba0">Python</text><rect x="94.4" y="206" width="51" height="22" rx="11" fill="none" stroke="#1a2438"/><text x="120" y="221" text-anchor="middle" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#7f8ba0">numpy</text><rect x="153.4" y="206" width="95" height="22" rx="11" fill="none" stroke="#1a2438"/><text x="201" y="221" text-anchor="middle" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="11" fill="#7f8ba0">Monte Carlo</text>
</svg>