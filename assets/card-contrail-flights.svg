<text x="28" y="118" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c4d4">Book flights on a spinning globe —</text><text x="28" y="139" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c4d4">planes fly every route, then pick</text><text x="28" y="160" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c4d4">a seat and print your pass.</text>
